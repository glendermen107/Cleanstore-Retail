version: "3.9"

services:
  # PostgreSQL Database
  cleanstore-postgres:
    image: postgres:16-alpine
    container_name: cleanstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: cleanstore
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5433:5432"
    networks:
      - cleanstore-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d cleanstore" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage
  cleanstore-minio:
    image: minio/minio:latest
    container_name: cleanstore-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    volumes:
      - minio_data:/data
    ports:
      - "9002:9000"
      - "9003:9001"
    networks:
      - cleanstore-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  # NestJS Backend API
  cleanstore-backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: cleanstore-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      POSTGRES_HOST: cleanstore-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: cleanstore
      MINIO_ENDPOINT: cleanstore-minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password
      MINIO_BUCKET: cleanstore
      MINIO_USE_SSL: false
      BACKEND_URL: http://cleanstore-backend:4000
      FRONTEND_URL: http://cleanstore-frontend:3000
      ADMIN_URL: http://cleanstore-admin:3001
    ports:
      - "4002:4000"
    networks:
      - cleanstore-network
    depends_on:
      cleanstore-postgres:
        condition: service_healthy
      cleanstore-minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js Frontend
  cleanstore-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cleanstore-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      BACKEND_URL: http://cleanstore-backend:4000
      MINIO_URL: http://cleanstore-minio:9000
    ports:
      - "3002:3000"
    networks:
      - cleanstore-network
    depends_on:
      cleanstore-backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js Admin Panel
  cleanstore-admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: cleanstore-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      BACKEND_URL: http://cleanstore-backend:4000
      MINIO_URL: http://cleanstore-minio:9000
    ports:
      - "3003:3001"
    networks:
      - cleanstore-network
    depends_on:
      cleanstore-backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3001" ]
      interval: 30s
      timeout: 10s
      retries: 3

# Networks
networks:
  cleanstore-network:
    driver: bridge
    name: cleanstore-network

# Volumes
volumes:
  postgres_data:
    driver: local
    name: cleanstore-postgres-data
  minio_data:
    driver: local
    name: cleanstore-minio-data
